provider: teamorouter
label:
  en_US: TeamoRouter
description:
  en_US: One API key for Claude, GPT, Gemini, DeepSeek, GLM, Kimi, and Qwen models.
icon_small:
  en_US: icon.svg
icon_large:
  en_US: icon.svg
background: "#F5F5F5"
help:
  title:
    en_US: Get a TeamoRouter API key
  url:
    en_US: https://teamorouter.com/dashboard
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
    placeholder:
      en_US: Enter your model name
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
    - variable: context_size
      label:
        en_US: Model context size
      type: text-input
      required: true
      default: "131072"
      placeholder:
        en_US: Enter the model context size
    - variable: max_tokens_to_sample
      label:
        en_US: Maximum response tokens
      type: text-input
      required: false
      default: "4096"
      placeholder:
        en_US: Enter a conservative output token limit
    - variable: function_calling_type
      label:
        en_US: Function calling
      type: select
      required: false
      default: tool_call
      options:
        - value: function_call
          label:
            en_US: Function call
        - value: tool_call
          label:
            en_US: Tool call
        - value: no_call
          label:
            en_US: Not supported
    - variable: stream_function_calling
      label:
        en_US: Stream tool calls
      type: select
      required: false
      default: supported
      options:
        - value: supported
          label:
            en_US: Supported
        - value: not_supported
          label:
            en_US: Not supported
    - variable: vision_support
      label:
        en_US: Image input
      type: select
      required: false
      default: no_support
      options:
        - value: support
          label:
            en_US: Supported
        - value: no_support
          label:
            en_US: Not supported
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
extra:
  python:
    provider_source: provider/teamorouter.py
    model_sources:
      - models/llm/llm.py
