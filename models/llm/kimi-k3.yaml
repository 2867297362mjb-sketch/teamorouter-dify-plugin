model: kimi-k3
label:
  en_US: Kimi K3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 131072
pricing:
  input: "3"
  output: "15"
  unit: "0.000001"
  currency: USD
deprecated: false
