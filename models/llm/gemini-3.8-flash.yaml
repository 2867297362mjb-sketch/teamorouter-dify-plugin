model: gemini-3.8-flash
label:
  en_US: Gemini 3.8 Flash
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
pricing:
  input: "0.75"
  output: "3.75"
  unit: "0.000001"
  currency: USD
deprecated: false
