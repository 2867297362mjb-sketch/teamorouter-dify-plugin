model: gpt-5.5
label:
  en_US: GPT-5.5
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 128000
pricing:
  input: "5"
  output: "30"
  unit: "0.000001"
  currency: USD
deprecated: false
